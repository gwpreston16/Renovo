# One-command start: `docker compose up`.
#
# This file runs the application as it ships: every container serves what its
# own image contains, and nothing reaches the network for an asset or a package.
# That is what an operator gets from `docker compose up`, on an air-gapped host
# included.
#
# Development adds the working tree on top — a live web root and an asset
# watcher — through a second file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# which is what `./bin/dev-setup.sh` does for you.
#
# PostgreSQL is the default engine. To run against MySQL instead, add the
# override file: `docker compose -f docker-compose.yml -f docker-compose.mysql.yml up`.
# Local development deliberately uses the same engine as production; SQLite is
# not used anywhere in this project.

# The Compose project name is pinned rather than taken from the directory, so
# container and volume names stay "renovo_*" wherever the repository is checked
# out or whatever the folder is called.
name: renovo

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:9090}
      DB_DRIVER: ${DB_DRIVER:-pgsql}
      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-renovo}
      DB_USER: ${DB_USER:-renovo}
      DB_PASSWORD: ${DB_PASSWORD:-renovo}
      SESSION_KEY: "${SESSION_KEY:?Set SESSION_KEY in .env. Generate one with 'openssl rand -hex 32'}"
      # Stored secrets (two-factor seeds, channel settings, the rate key) are
      # encrypted under SECRETS_KEY, falling back to TOTP_ENCRYPTION_KEY and
      # then SESSION_KEY. Every service that reads or writes them gets all
      # four, or one would encrypt under a different key from the others.
      SECRETS_KEY: ${SECRETS_KEY:-}
      SECRETS_PREVIOUS_KEYS: ${SECRETS_PREVIOUS_KEYS:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Strict-Transport-Security (Phase 41): only the web-facing app sends
      # it, and only when APP_URL is https. See docs/security.md.
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}
      # API tokens (Phase 42): the maximum lifetime of a new token (blank for
      # none) and the per-minute limits on /api/v1. Only the app serves the
      # API; the scheduler just prunes the counters.
      API_TOKEN_MAX_DAYS: ${API_TOKEN_MAX_DAYS:-}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      API_RATE_LIMIT_PER_IP_PER_MINUTE: ${API_RATE_LIMIT_PER_IP_PER_MINUTE:-30}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-none}
      MAIL_VERIFY_PEER: ${MAIL_VERIFY_PEER:-true}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-renovo@localhost}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Renovo}
      # Phase 43: what the HTTP client may reach: open, allowlist or off.
      OUTBOUND_HTTP: ${OUTBOUND_HTTP:-open}
      # The update check: the app asks lazily, from an administrator's
      # dashboard, and the scheduler daily, so both need the operator's say.
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      UPDATE_CHECK_REPOSITORY: ${UPDATE_CHECK_REPOSITORY:-gwpreston16/Renovo}
      # Instance backups (Phase 38). The app takes them when an administrator
      # presses Back up now and serves the downloads; the scheduler takes the
      # scheduled ones. Both need the same key and directory.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-}
      # Backups off the server (Phase 39): how long one transfer may take,
      # and the empty database a restore rehearsal restores into. Without
      # BACKUP_REHEARSAL_DB_NAME a rehearsal downloads and verifies only.
      BACKUP_TRANSFER_TIMEOUT_SECONDS: ${BACKUP_TRANSFER_TIMEOUT_SECONDS:-1800}
      BACKUP_REHEARSAL_DB_DRIVER: ${BACKUP_REHEARSAL_DB_DRIVER:-}
      BACKUP_REHEARSAL_DB_HOST: ${BACKUP_REHEARSAL_DB_HOST:-}
      BACKUP_REHEARSAL_DB_PORT: ${BACKUP_REHEARSAL_DB_PORT:-}
      BACKUP_REHEARSAL_DB_NAME: ${BACKUP_REHEARSAL_DB_NAME:-}
      BACKUP_REHEARSAL_DB_USER: ${BACKUP_REHEARSAL_DB_USER:-}
      BACKUP_REHEARSAL_DB_PASSWORD: ${BACKUP_REHEARSAL_DB_PASSWORD:-}
    # The web root comes from the image, and the `web` container is built from
    # the same one, so the two agree about every asset's name and age without
    # either of them reading the host. Development replaces both with the
    # working tree, together, in docker-compose.dev.yml — the one thing that
    # must never happen is for them to disagree.
    volumes:
      - logos:/var/www/html/public/assets/logos
      - appvar:/var/www/html/var

  web:
    # Built, not a bare nginx image: the web root it serves contains the
    # compiled assets, and those exist only inside the image — `public/build/`
    # is generated and not in git, so a bare nginx pointed at a fresh clone
    # would have no stylesheet to serve and the app would have no manifest to
    # resolve.
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-9090}:80"
    volumes:
      - logos:/var/www/html/public/assets/logos:ro
    # Readiness, not liveness: this container is only useful once the thing
    # behind it can answer, and /readyz is the endpoint that knows whether the
    # database, the schema and the scheduler are all in order.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/readyz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    # Bound to loopback only: this is for host-side tooling (phinx, phpunit,
    # psql), not for exposing the database to the network.
    ports:
      - "127.0.0.1:${DB_PORT_PUBLISHED:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-renovo}
      POSTGRES_USER: ${DB_USER:-renovo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-renovo}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-renovo} -d ${DB_NAME:-renovo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies migrations once, then exits. `docker compose up` waits for it
  # before the app is useful, and re-running it is harmless.
  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_DRIVER: ${DB_DRIVER:-pgsql}
      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-renovo}
      DB_USER: ${DB_USER:-renovo}
      DB_PASSWORD: ${DB_PASSWORD:-renovo}
      # The Phase 40 backfills encrypt channel settings, so the migration needs
      # the real keys — never a placeholder it would encrypt under.
      SESSION_KEY: "${SESSION_KEY:?Set SESSION_KEY in .env. Generate one with 'openssl rand -hex 32'}"
      SECRETS_KEY: ${SECRETS_KEY:-}
      SECRETS_PREVIOUS_KEYS: ${SECRETS_PREVIOUS_KEYS:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
    command: ["vendor/bin/phinx", "migrate", "--configuration", "phinx.php"]
    restart: "no"

  # Runs the reminder sweep and the housekeeping once a day.
  #
  # A sleep loop rather than cron, so the deployment needs no cron daemon in the
  # image and no second place to configure a schedule. Running it more often
  # than daily is harmless — every dispatch is claimed in the notification
  # ledger before it is sent, so a repeated run sends nothing twice. Operators
  # who would rather use the host's cron can run the same command directly; the
  # entry is in docs/operations.md.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_DRIVER: ${DB_DRIVER:-pgsql}
      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-renovo}
      DB_USER: ${DB_USER:-renovo}
      DB_PASSWORD: ${DB_PASSWORD:-renovo}
      # The scheduler sends through the channels, so it reads their settings
      # with the same keys as the app.
      SESSION_KEY: "${SESSION_KEY:?Set SESSION_KEY in .env. Generate one with 'openssl rand -hex 32'}"
      SECRETS_KEY: ${SECRETS_KEY:-}
      SECRETS_PREVIOUS_KEYS: ${SECRETS_PREVIOUS_KEYS:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:9090}
      # The scheduler is what actually sends the reminders, so it needs the
      # whole relay configuration rather than the subset the app needs for
      # verification and reset mail.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-none}
      MAIL_VERIFY_PEER: ${MAIL_VERIFY_PEER:-true}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-renovo@localhost}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Renovo}
      # Phase 43: what the HTTP client may reach: open, allowlist or off.
      OUTBOUND_HTTP: ${OUTBOUND_HTTP:-open}
      # The update check: the app asks lazily, from an administrator's
      # dashboard, and the scheduler daily, so both need the operator's say.
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      UPDATE_CHECK_REPOSITORY: ${UPDATE_CHECK_REPOSITORY:-gwpreston16/Renovo}
      # Instance backups (Phase 38). The app takes them when an administrator
      # presses Back up now and serves the downloads; the scheduler takes the
      # scheduled ones. Both need the same key and directory.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-}
      # Backups off the server (Phase 39): how long one transfer may take,
      # and the empty database a restore rehearsal restores into. Without
      # BACKUP_REHEARSAL_DB_NAME a rehearsal downloads and verifies only.
      BACKUP_TRANSFER_TIMEOUT_SECONDS: ${BACKUP_TRANSFER_TIMEOUT_SECONDS:-1800}
      BACKUP_REHEARSAL_DB_DRIVER: ${BACKUP_REHEARSAL_DB_DRIVER:-}
      BACKUP_REHEARSAL_DB_HOST: ${BACKUP_REHEARSAL_DB_HOST:-}
      BACKUP_REHEARSAL_DB_PORT: ${BACKUP_REHEARSAL_DB_PORT:-}
      BACKUP_REHEARSAL_DB_NAME: ${BACKUP_REHEARSAL_DB_NAME:-}
      BACKUP_REHEARSAL_DB_USER: ${BACKUP_REHEARSAL_DB_USER:-}
      BACKUP_REHEARSAL_DB_PASSWORD: ${BACKUP_REHEARSAL_DB_PASSWORD:-}
    # The same var/ volume as the app. `maintenance:prune` clears staged
    # imports that were uploaded and never finished, and those files are written
    # by the app container — without this the scheduler would be tidying its own
    # empty directory and the real ones would accumulate for ever.
    #
    # The logos too, read-only: an instance backup carries every subscription's
    # logo, and the scheduler is what takes the scheduled ones.
    volumes:
      - appvar:/var/www/html/var
      - logos:/var/www/html/public/assets/logos:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          php bin/console reminders:run || true
          php bin/console maintenance:prune || true
          php bin/console backup:run || true
          php bin/console backup:rehearse || true
          sleep 86400
        done

  # An empty database for restore rehearsals (Phase 39), never the one above.
  # Uncomment it, then set BACKUP_REHEARSAL_DB_DRIVER=pgsql (even on MySQL),
  # BACKUP_REHEARSAL_DB_HOST=rehearsal-db,
  # BACKUP_REHEARSAL_DB_NAME=rehearsal, BACKUP_REHEARSAL_DB_USER=rehearsal and
  # BACKUP_REHEARSAL_DB_PASSWORD in .env. A rehearsal restores into it, checks
  # what it restored and drops every table again. It holds a copy of the data
  # only while a rehearsal runs; no port is published.
  #
  # rehearsal-db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: rehearsal
  #     POSTGRES_USER: rehearsal
  #     POSTGRES_PASSWORD: ${BACKUP_REHEARSAL_DB_PASSWORD:?Set BACKUP_REHEARSAL_DB_PASSWORD in .env}
  #   volumes:
  #     - rehearsal-db:/var/lib/postgresql/data

  # Catches outbound mail in development. Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  # rehearsal-db:
  database:
  logos:
  appvar:
