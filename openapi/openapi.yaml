# The Renovo API, version 1.
#
# This file is the source of truth, not a rendering of one. It is written by
# hand, served verbatim at /api/v1/openapi.yaml, and checked against the
# application's own route table in CI: an endpoint that exists without being
# described here fails the build, and so does a description with no endpoint
# behind it.
openapi: 3.0.3

info:
  title: Renovo API
  version: "1.9.7"
  description: |
    Read and write subscriptions, categories, payment methods, tags and attachments.

    **Authentication.** Every endpoint except the two OpenAPI documents needs a
    token, issued under Settings → API tokens and sent as
    `Authorization: Bearer rnv_<public id>_<secret>`. Session cookies are not
    accepted: the API is deliberately unreachable with a browser's ambient
    credentials, which is what makes it safe for it to be exempt from CSRF
    tokens. Changing or resetting the issuing account's password revokes all of
    its tokens, calendar feed tokens included.

    **A token narrows, it never grants.** Each token holds scopes —
    `subscriptions:read`, `subscriptions:write`, `catalogue:read`,
    `catalogue:write`, `calendar:read` — and each operation names the one it
    needs as `x-token-scope` (`any` for a valid token of any scope). `:write`
    includes `:read` for the same resource. A token without the scope gets
    `403`. The request still runs under the household role of the account that
    issued the token, so a Viewer's `subscriptions:write` token still cannot
    write.

    **Rate limits.** 120 requests a minute per token, and 30 a minute per
    address for requests with no valid token, by default; an instance may set
    its own. Every response the limiter has counted carries `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset` (seconds until the window
    resets). Over the limit is `429` with `Retry-After`. Ten failed tokens from
    one address in five minutes block that address, a valid token included,
    until the five minutes are up.

    **Tokens expire.** A new token lasts 90 days unless its owner chose
    otherwise, and an instance may set a maximum. `GET /me` reports the token's
    scopes and expiry.

    **Wrong types and impossible dates are refused.** A text field sent as a
    boolean, a list or an object is a `422` on that field and clears nothing,
    and so is a whole-number field (an id, an interval, a notice amount) sent
    as text that is not a number, a boolean or a list; an absent key keeps the
    stored value and `null` clears it. A date that does not exist is a `422`,
    never rolled over to another day. A value outside an enum, such as an
    unknown `subscription_type` or `notice_period_unit`, is a `422` on that
    field; an empty or absent `subscription_type` still means `recurring`.

    **Money is always an integer in minor units** (`price_minor: 1999` with
    `currency: GBP` is £19.99), never a decimal. JSON numbers are binary floats
    in most clients and 19.99 is not representable in one.

    **There is no PATCH.** `PUT` replaces the whole resource. To change one
    field, `GET` the resource, edit the representation and `PUT` it back.

    **Not in version 1.** Shared-cost splits, scheduled price changes and the
    usage counter are editable in the web interface but have no endpoints here.
    Each is a sub-resource with rules of its own — a split has to total its
    shares, a scheduled price has an effective date that interacts with the
    price history, a usage count has a period it is measured over — and giving
    each a half-considered endpoint now would fix a shape that is awkward to
    change once clients depend on it. They read as part of a subscription
    (`split_mode`, `usage_count`, `usage_rating`) and are written through the
    web interface until a later version describes them properly.
  license:
    name: MIT

servers:
  - url: /
    description: This instance.

tags:
  - name: Subscriptions
  - name: Attachments
  - name: Payments
  - name: Savings
  - name: Taxonomy
  - name: Calendar
  - name: Meta

security:
  - bearerToken: []

paths:
  /api/v1/openapi.yaml:
    get:
      tags: [Meta]
      summary: This document, as YAML.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/openapi.json:
    get:
      tags: [Meta]
      summary: This document, as JSON.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object

  /api/v1/me:
    get:
      x-token-scope: "any"
      tags: [Meta]
      summary: The token's identity, role and effective permissions.
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: Who this token is.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/instance:
    get:
      x-token-scope: "any"
      tags: [Meta]
      summary: The release this instance runs.
      description: |
        The version from the instance's VERSION file, and the short commit id
        an edge or development image was built from (null for a release
        image). Any valid token may read it; it is not offered to anybody
        without one.
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: The instance's release.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/subscriptions:
    get:
      x-token-scope: "subscriptions:read"
      tags: [Subscriptions]
      summary: List subscriptions.
      description: |
        Returns only what the token's role and the instance's isolation mode
        allow — the same rows the same user would see in the web interface.
        With a `subscriptions:write` token, it first runs the catch-up: due price
        changes take effect, ended trials convert, overdue payment dates
        move on, recording each passed date as a payment, and a fixed term
        whose last payment has passed is cancelled as of the day after it. A
        token without it changes nothing.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search names and notes. }
        - { name: category, in: query, schema: { type: integer }, description: Category id. }
        - { name: owner, in: query, schema: { type: integer }, description: Owner user id. }
        - name: tag
          in: query
          style: form
          explode: true
          schema:
            oneOf:
              - { type: integer }
              - { type: array, items: { type: integer } }
          description: >
            Tag id. For several, send the array form `tag[]=3&tag[]=7`: a
            plain repeated `tag=3&tag=7` keeps only the last. A subscription
            matches when it has any of them.
        - { name: currency, in: query, schema: { type: string }, description: ISO 4217 code. }
        - name: type
          in: query
          schema: { type: string, enum: [recurring, one_off, lifetime] }
        - name: inactive
          in: query
          schema: { type: string, enum: ["1"] }
          description: Include inactive subscriptions — paused and cancelled.
        - name: status
          in: query
          schema: { type: string, enum: [active, trial, paused, cancelled] }
          description: >
            Only subscriptions in this state (see `status` on the resource).
            Takes precedence over `inactive`.
        - name: sort
          in: query
          schema: { type: string, enum: [name, next_payment, price, created] }
          description: >
            Whatever is chosen, inactive subscriptions are ordered after active
            ones, and rows with no value in the sort column (a lifetime licence
            has no next payment date) after those that have one.
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
        - name: page
          in: query
          description: A page past the last is empty, however large the number.
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: A page of subscriptions.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subscription"
                  meta:
                    $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      x-token-scope: "subscriptions:write"
      tags: [Subscriptions]
      summary: Create a subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema: { type: string }
              description: The new subscription's URL.
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      x-token-scope: "subscriptions:read"
      tags: [Subscriptions]
      summary: Fetch one subscription.
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: The subscription.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    put:
      x-token-scope: "subscriptions:write"
      tags: [Subscriptions]
      summary: Replace a subscription.
      description: |
        A full replacement. Any field the body omits takes its documented
        default, so read the resource and send it back edited rather than
        sending only what changed.

        The logo is the one exception: it is a file with endpoints of its own,
        and a `PUT` leaves it as it is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: The updated subscription.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: >-
            The `logo` part carried no file, or the file is not a PNG, JPEG, GIF or WebP
            image. The existing logo is left in place.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      x-token-scope: "subscriptions:write"
      tags: [Subscriptions]
      summary: Delete a subscription.
      responses:
        "204":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/subscriptions/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      x-token-scope: "subscriptions:write"
      tags: [Subscriptions]
      summary: Cancel the subscription.
      description: |
        Finished, as of today: `cancelled_at` is set and the subscription is
        made inactive, so it leaves every total, the forecast, budgets,
        reminders and the calendar. On a trial it stops the conversion — a
        cancelled trial never becomes a paid subscription. Cancelling an
        already-cancelled subscription keeps the first date. Needs the same
        access as editing it.
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: The cancelled subscription.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/subscriptions/{id}/uncancel:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      x-token-scope: "subscriptions:write"
      tags: [Subscriptions]
      summary: Undo a cancellation.
      description: |
        Clears `cancelled_at`. The subscription returns to **paused**, not
        active, so an accidental cancel corrected cannot silently restart
        charges; resume it with a PUT setting `is_active` to true. A fixed
        term the catch-up ended is ended again by any catch-up while its
        `payments_end_on` has passed: to bring one back, PUT an empty
        `payments_end_on`, or one on or after the first billing date from
        today, first, while it is still cancelled, then uncancel and resume
        it. A resume whose end is still before that date is a `422` on
        `payments_end_on`.
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: The subscription, now paused.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/subscriptions/{id}/logo:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      x-token-scope: "subscriptions:write"
      tags: [Subscriptions]
      summary: Replace the subscription's logo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: PNG, JPEG, GIF or WebP. The type is read from the file, not its name.
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: The updated subscription.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      x-token-scope: "subscriptions:write"
      tags: [Subscriptions]
      summary: Remove the subscription's logo.
      responses:
        "204":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/subscriptions/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      x-token-scope: "subscriptions:read"
      tags: [Attachments]
      summary: List the invoices and receipts filed against a subscription.
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: The attachments.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      x-token-scope: "subscriptions:write"
      tags: [Attachments]
      summary: Attach an invoice or receipt.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    PDF, PNG, JPEG, WebP or GIF. The type is determined from the
                    file's contents; the filename and the declared content type
                    are ignored.
                period_date:
                  type: string
                  format: date
                  nullable: true
                  description: |
                    The billing period this document covers, if any. A date
                    that does not exist, or is not `YYYY-MM-DD`, is a `422`, even when a
                    `charge_id` is sent.
                charge_id:
                  type: integer
                  nullable: true
                  description: |
                    The payment this is the invoice for. It must be one of this
                    subscription's charges; the attachment is then dated to it.
      responses:
        "201":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/subscriptions/{id}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
      - name: attachmentId
        in: path
        required: true
        schema: { type: integer }
    get:
      x-token-scope: "subscriptions:read"
      tags: [Attachments]
      summary: Download an attachment.
      responses:
        "200":
          description: >
            The file, with the `Content-Type` it was stored with (its type as
            detected when it was uploaded) and a `Content-Disposition:
            attachment` header carrying its original name.
          headers:
            Content-Disposition:
              schema: { type: string }
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      x-token-scope: "subscriptions:write"
      tags: [Attachments]
      summary: Delete an attachment.
      responses:
        "204":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/subscriptions/{id}/charges:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      x-token-scope: "subscriptions:read"
      tags: [Payments]
      summary: List a subscription's charges, newest first.
      description: |
        The payment ledger: one charge for each billing date that has passed,
        at the price in force that day, plus any added by hand. Nothing here
        is read from a bank. With a `subscriptions:write` token, the request first
        runs the same catch-up as the subscription list, so every passed date
        is there. Paged; a page past the last returns the last.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: A page of charges.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Charge"
                  meta:
                    $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      x-token-scope: "subscriptions:write"
      tags: [Payments]
      summary: Add a charge that fell off the billing cycle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, amount_minor]
              properties:
                date:
                  type: string
                  format: date
                  description: Today or earlier. One charge a day per subscription.
                amount_minor:
                  type: integer
                  minimum: 0
                  description: |
                    Minor units, in the subscription's currency. The web form's
                    decimal `amount` is not accepted here.
                note: { type: string, nullable: true, maxLength: 255 }
      responses:
        "201":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Charge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/charges/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      x-token-scope: "subscriptions:write"
      tags: [Payments]
      summary: Record what a charge really was, skip it, or annotate it.
      description: |
        Fields not sent keep their value. `actual_minor: null` clears a
        recorded amount; `status: skipped` marks a charge that did not
        happen, and clears its actual. An `actual_minor` sent without a
        `status` says the charge happened, so it also sets `charged` — on a
        skipped charge too; sending `skipped` with an actual is a 422. A charge the token can see but may not
        change is a 404. `is_discount: true` says an actual below the
        expected amount was a discount, making the expected amount the
        charge's `reference_minor`; `false` takes a discount off, and does
        nothing on a charge an offer stands behind. Sent without it, a
        discount stays while the actual is still lower — and through a skip,
        while it saves nothing — and goes when it is cleared or raised to the
        expected amount. A discount on an actual
        that is not lower, or on a charge an offer already stands behind, is
        a 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actual_minor: { type: integer, minimum: 0, nullable: true }
                status: { type: string, enum: [charged, skipped] }
                note: { type: string, nullable: true, maxLength: 255 }
                is_discount: { type: boolean }
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: The charge as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Charge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/savings:
    get:
      x-token-scope: "subscriptions:read"
      tags: [Savings]
      summary: What offers and cancellations have saved.
      description: |
        History, never a projection. **Offers**: each charge's reference —
        the price after its introductory or promotional offer, or the
        expected amount of one a member marked as a discount — less what it
        cost, never below nothing; a skipped charge saves nothing.
        **Cancellations**: for each cancelled subscription, the charges it
        would have made after it was cancelled, priced as the history says,
        up to today and at most `cap_months` months on — leaving out charges
        its notice period had already committed. A fixed term that ran its
        course, a restored subscription and one paused when it was cancelled
        add nothing; a trial cancelled before it charged is counted in
        `trials`, not valued. `run_rate` is the yearly cost removed by the
        last twelve months' cancellations, at the price on each cancellation
        date. In ISOLATED mode the figures are the token holder's own,
        counting their share of a split bill. With a `subscriptions:write` token,
        the request first runs the catch-up.
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: Both figures and what is behind them.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Savings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

