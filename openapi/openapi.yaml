  /api/v1/calendar.ics:
    get:
      x-token-scope: "calendar:read"
      tags: [Calendar]
      summary: Renewals, trial conversions and cancellation deadlines as iCalendar.
      description: |
        A read-only feed for a calendar client. A fixed term's renewals stop
        at its last payment, and no deadline is published after it. A trial
        that has not converted yet shows its conversion, then the renewals that
        follow it. Because
        such a client cannot
        send an `Authorization` header, this endpoint — and only this endpoint —
        takes its token in the `token` query parameter. The token needs the
        `calendar:read` scope, and one holding any write scope is refused
        rather than downgraded: a credential that can change data does not
        belong in a subscription URL. It shares the token's rate limit.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: A token with `calendar:read` and no write scope.
      responses:
        "200":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: An iCalendar document.
          content:
            text/calendar:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          description: The token lacks `calendar:read`, or holds a write scope, which this endpoint refuses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        An API token issued under Settings → API tokens. Its scopes narrow what
        it may reach; each operation names the one it needs as
        `x-token-scope`. Descriptive only: the token is a bearer credential,
        not an OAuth grant, though the scope names are chosen so they could
        become OAuth scopes.
      x-scopes:
        subscriptions:read: Subscriptions, their attachments, payments and savings.
        subscriptions:write: Change subscriptions, their attachments and payments. Includes subscriptions:read.
        catalogue:read: Categories, tags and payment methods.
        catalogue:write: Change categories, tags and payment methods. Includes catalogue:read.
        calendar:read: The iCalendar feed.

  parameters:
    SubscriptionId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    BadRequest:
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      description: No token was presented, or it is revoked, expired or unknown.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      description: |
        The token does not hold the scope the operation needs (the message
        names it), or the role of the account behind it does not permit this.
        On a read-only demonstration instance every write is refused with this
        status, whatever the role: "This instance is a read-only
        demonstration. Nothing here can be changed."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      description: |
        No such row — or one the caller may not see. The two are deliberately
        indistinguishable, so that probing for another household's ids tells the
        prober nothing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      description: The body was understood but is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: |
        The token, or the address for a request with no valid token, is over
        its limit for the current window — or the address has failed token
        authentication ten times in five minutes. Wait `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  headers:
    Retry-After:
      description: Seconds until the request may be made again.
      schema: { type: integer }
    RateLimit-Limit:
      description: >
        Requests allowed in the current window. Sent on every counted response.
        On a 429 for failed token authentication it is the ten failures allowed
        in five minutes, and RateLimit-Reset counts down to the end of those
        five minutes.
      schema: { type: integer }
    RateLimit-Remaining:
      description: Requests left in the current window. Sent on every counted response.
      schema: { type: integer }
    RateLimit-Reset:
      description: Seconds until the current window resets. Sent on every counted response.
      schema: { type: integer }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, title, message]
          properties:
            status: { type: integer }
            title: { type: string }
            message: { type: string }
            errors:
              type: object
              description: >-
                Field name to message, the name being the field the client
                sent (a bad price is under `price_minor`). Present on a 422.
              additionalProperties: { type: string }

    Page:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    Identity:
      type: object
      required: [user, household_id, role, isolation_mode, permissions, token]
      properties:
        user:
          type: object
          required: [id, email, display_name, is_instance_admin]
          properties:
            id: { type: integer }
            email: { type: string }
            display_name: { type: string }
            is_instance_admin: { type: boolean }
        household_id: { type: integer, nullable: true }
        role:
          type: string
          nullable: true
          enum: [owner_admin, editor, contributor, viewer]
        isolation_mode:
          type: string
          enum: [shared, isolated]
        permissions:
          type: array
          items: { type: string }
        token:
          $ref: "#/components/schemas/Token"

    Token:
      type: object
      description: The token the request was made with. Never its secret.
      required: [id, name, public_id, scopes, abilities, last_used_at, expires_at, revoked_at, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        public_id: { type: string, example: 0f3c2a9be81d44c7a1b2c3d4 }
        scopes:
          type: array
          items:
            type: string
            enum: ["subscriptions:read", "subscriptions:write", "catalogue:read", "catalogue:write", "calendar:read"]
        abilities:
          type: string
          enum: [read, write]
          deprecated: true
          description: >
            What the token could do before scopes: `write` when it holds any
            write scope. Kept for one release; read `scopes` instead.
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Instance:
      type: object
      required: [version, build]
      properties:
        version: { type: string, example: "1.7.0" }
        build: { type: string, nullable: true, example: null }

    Category:
      type: object
      required: [id, name, colour]
      properties:
        id: { type: integer }
        name: { type: string }
        colour: { type: string, nullable: true }

    PaymentMethod:
      type: object
      required: [id, name, colour, icon, logo_path]
      properties:
        id: { type: integer }
        name: { type: string }
        colour: { type: string, nullable: true }
        icon:
          type: string
          nullable: true
          description: |
            A generic icon from the application's own set, carried by the
            seeded defaults. Never a brand's mark.
        logo_path:
          type: string
          nullable: true
          description: Read-only. An uploaded logo; set it with the logo endpoints.

    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    Attachment:
      type: object
      required: [id, subscription_id, filename, mime_type, size_bytes, period_date, charge_id, created_at]
      properties:
        id: { type: integer }
        subscription_id: { type: integer }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        period_date: { type: string, format: date, nullable: true }
        charge_id:
          type: integer
          nullable: true
          description: The charge this is the invoice for, when it is filed against one.
        created_at: { type: string, format: date-time }

    Charge:
      type: object
      required:
        - id
        - subscription_id
        - due_date
        - currency
        - expected_minor
        - actual_minor
        - amount_minor
        - status
        - source
        - note
        - reference_minor
        - saving_minor
        - is_discount
        - created_at
        - updated_at
      properties:
        id: { type: integer }
        subscription_id: { type: integer }
        due_date: { type: string, format: date }
        currency: { type: string }
        expected_minor:
          type: integer
          description: >-
            The price in force on the due date, frozen when the charge was
            written — except that a `manual` charge adopted as a billing
            date's charge takes the price due, its own amount moving to
            `actual_minor`.
        actual_minor:
          type: integer
          nullable: true
          description: What was really charged, when a member recorded it.
        amount_minor:
          type: integer
          description: What the charge counts as — the actual, else the expected; 0 when skipped.
        status: { type: string, enum: [charged, skipped] }
        source:
          type: string
          enum: [catch_up, manual, reconstructed, one_off, paused]
          description: |
            `one_off` is a one-off or lifetime entry's own charge, the one a
            change of its date moves. `paused` is a billing date a pause
            stepped over, written `skipped` when the row was resumed — or,
            when a payment added by hand stood on it, that payment with its
            own status. A `manual` charge on a billing date becomes that
            date's `catch_up` (or `reconstructed`, `one_off` or `paused`)
            charge, same id, when the catch-up, the backfill or a resume
            reaches it — so a later read may differ from the `201` body: its
            amount moves to `actual_minor` (a skipped one stays skipped, with
            no actual) and `expected_minor` takes the price due. One in
            another currency than the price due stays `manual` at the
            catch-up and the backfill; a resume still makes it the month's
            `paused` charge, keeping its own `currency` and `expected_minor`.
        note: { type: string, nullable: true }
        reference_minor:
          type: integer
          nullable: true
          description: >-
            What the charge would have cost without its offer: the first
            ordinary price after the promotional one in force on its due date,
            written with the charge and frozen — or, when a member marked a
            lower actual as a discount, the expected amount. Read-only; set a
            discount with `is_discount` on `PATCH`. When a `manual` charge is
            adopted as a billing date's charge it takes that date's offer
            reference, or keeps a discount — now against the price due —
            while its actual is still below it.
        saving_minor:
          type: integer
          description: >-
            What the offer or discount took off: `reference_minor` less
            `amount_minor`, never below 0; 0 when there is no reference or the
            charge was skipped.
        is_discount:
          type: boolean
          description: Whether the reference is a member's discount rather than an offer's.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SavingsTotal:
      type: object
      required: [currency, amount_minor]
      properties:
        currency: { type: string }
        amount_minor: { type: integer }

    SavingsFigure:
      type: object
      required: [totals, combined]
      description: >-
        One figure: each currency's amount, and their sum in the instance's
        base currency — `amount_minor` null, with the currencies that have no
        rate in `unconvertible`, when one does not convert.
      properties:
        totals:
          type: array
          items: { $ref: "#/components/schemas/SavingsTotal" }
        combined:
          type: object
          required: [currency, amount_minor, unconvertible]
          properties:
            currency: { type: string }
            amount_minor: { type: integer, nullable: true }
            unconvertible:
              type: array
              items: { type: string }

    Savings:
      type: object
      required: [offers, cancellations]
      properties:
        offers:
          type: object
          required: [total, by_year, by_subscription]
          properties:
            total: { $ref: "#/components/schemas/SavingsFigure" }
            by_year:
              type: array
              description: Newest year first.
              items:
                allOf:
                  - $ref: "#/components/schemas/SavingsFigure"
                  - type: object
                    required: [year]
                    properties:
                      year: { type: integer }
            by_subscription:
              type: array
              items:
                type: object
                required: [subscription_id, name, totals, charges]
                properties:
                  subscription_id: { type: integer }
                  name: { type: string }
                  totals:
                    type: array
                    items: { $ref: "#/components/schemas/SavingsTotal" }
                  charges: { type: integer, description: The charges that saved something. }
        cancellations:
          type: object
          required: [realised, run_rate, by_subscription, trials, cap_months]
          properties:
            realised: { $ref: "#/components/schemas/SavingsFigure" }
            run_rate: { $ref: "#/components/schemas/SavingsFigure" }
            by_subscription:
              type: array
              items:
                type: object
                required: [subscription_id, name, cancelled_on, totals, charges, committed, run_rate]
                properties:
                  subscription_id: { type: integer }
                  name: { type: string }
                  cancelled_on: { type: string, format: date }
                  totals:
                    type: array
                    items: { $ref: "#/components/schemas/SavingsTotal" }
                  charges: { type: integer, description: The charges avoided and counted. }
                  committed:
                    type: integer
                    description: Charges its notice period had already committed, not counted.
                  run_rate:
                    type: object
                    nullable: true
                    required: [currency, amount_minor]
                    description: Its yearly cost, when it was cancelled in the last twelve months.
                    properties:
                      currency: { type: string }
                      amount_minor: { type: integer }
            trials: { type: integer, description: Trials cancelled before they charged. }
            cap_months: { type: integer }

    SubscriptionInput:
      type: object
      required: [name, price_minor, currency]
      description: |
        The writable half of a subscription. Everything the web form can set is
        here; the derived figures and the logo are not.

        Every text field (`name`, `notes`, `plan`, `visibility` and the rest)
        takes a string or null. A true, false, list or object there is a 422 on
        that field, not a cleared value.
      properties:
        name: { type: string, maxLength: 150 }
        notes: { type: string, nullable: true, maxLength: 5000 }
        website_url:
          type: string
          nullable: true
          maxLength: 300
          description: |
            Where the subscription is managed. A bare host is accepted and
            stored as https.
        price_minor:
          type: integer
          maximum: 1000000000000
          description: >-
            Minor units. £19.99 is 1999. A fraction, text, a boolean or a list
            is a 422 asking for a whole number of minor units; more than the
            maximum is a 422 too.
        currency: { type: string, description: ISO 4217 code. }
        subscription_type:
          type: string
          enum: [recurring, one_off, lifetime]
          default: recurring
        billing_cycle:
          type: string
          nullable: true
          enum: [weekly, monthly, quarterly, yearly, custom_days]
        cycle_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3650
          description: Required when billing_cycle is custom_days.
        cycle_interval:
          type: integer
          nullable: true
          minimum: 1
          maximum: 52
          default: 1
          description: |
            Every N of the cycle's unit: monthly with 6 is every six months,
            weekly with 2 is fortnightly. Weekly takes 1–52, monthly 1–24 and
            yearly 1–10; quarterly and custom_days take only 1, and any other
            value is a 422 rather than a clamp. Omitted or null is 1 on a new
            subscription; on a PUT that keeps the same billing_cycle, an
            absent key keeps the current interval.
        next_payment_date:
          type: string
          format: date
          nullable: true
          description: |
            Required for a recurring subscription that is not a trial. A date
            that does not exist (`2026-02-30`) is a `422`, as it is for every
            date field; it is never rolled over to another day.
        start_date:
          type: string
          format: date
          nullable: true
          description: |
            The rules follow the type the request submits: a one-off turning
            recurring keeps its payment as history. On a one-off or lifetime
            entry, changing it moves the entry's own
            payment (source `one_off`) to the new date, today included, with
            what was recorded on it; a future date removes it until that day
            passes. A date that already has another payment is a 422. Other
            payments are not touched.
        notice_period_amount: { type: integer, nullable: true, minimum: 0, maximum: 3650 }
        notice_period_unit:
          type: string
          nullable: true
          enum: [days, weeks, months]
        reminder_days:
          type: array
          nullable: true
          items: { type: integer, minimum: 0, maximum: 365 }
          maxItems: 6
          description: |
            Three states. Omitted or null means "use my notification
            preference"; an empty array means "never remind me about this one";
            a list of lead times overrides the preference for this subscription.
        is_trial: { type: boolean, default: false }
        trial_end_date:
          type: string
          format: date
          nullable: true
          description: A date that does not exist is a `422`.
        converts_to_price_minor:
          type: integer
          nullable: true
          maximum: 1000000000000
          description: Minor units. A fraction is a 422 asking for a whole number of minor units.
        converts_to_billing_cycle:
          type: string
          nullable: true
          enum: [weekly, monthly, quarterly, yearly, custom_days]
        converts_to_cycle_days: { type: integer, nullable: true }
        converts_to_cycle_interval:
          type: integer
          nullable: true
          minimum: 1
          maximum: 52
          description: |
            The interval of the cycle the trial converts to, bounded as
            cycle_interval, and kept the same way when a PUT omits it. Null
            when it converts to the cycle it already has.
        is_active:
          type: boolean
          default: true
          description: |
            False pauses the subscription. Pausing records the billing dates
            already passed first and keeps the payment date the catch-up moved
            the row to, unless the PUT sends another: the date the row was
            read with is not written back over it. A cancelled subscription
            stays inactive whatever is sent; un-cancel it first. Resuming a paused
            subscription skips the dates the pause covered: a
            `next_payment_date` in the past moves on, by whole cycles, to the
            first billing date from today, and each date it steps over is
            recorded as a `skipped` charge with `source` `paused` — except one
            that already has a payment added by hand, which becomes that
            date's `paused` charge, keeping its status. Billed for
            one of those months after all? `PATCH` that charge's
            `actual_minor`; a `POST` on its date is a `422`.
        plan:
          type: string
          nullable: true
          maxLength: 60
          description: |
            The tier it is on — "Standard", "Family". An absent key keeps the
            current value; send null or an empty string to clear it.
        contract_ends_on:
          type: string
          format: date
          nullable: true
          description: |
            The day its contract ends. The subscription keeps running after
            it; the date is announced at the member's lead times (alert type
            `contract_ending`) and listed beside cancel-by deadlines. A date
            that does not exist is a `422`. An absent key keeps the current
            value; send null or an empty string to clear it.
        payments_end_on:
          type: string
          format: date
          nullable: true
          description: |
            The last charge of a fixed term: the last billing date on or
            before it is the final payment. Nothing is charged or forecast
            after it, and when the catch-up next runs after the final payment
            the subscription is cancelled with `cancelled_at` the day after it. Recurring subscriptions
            only (cleared when a PUT makes the row a one-off or lifetime entry);
            it may not come before `start_date` or the next charge (`422`),
            which a PUT that leaves it out is measured against too. Resuming a
            paused term whose end is still before the first billing date from
            today is a `422`: the next catch-up would end it again. A date that
            does not exist is a `422`. An absent key keeps the current value;
            send null or an empty string to clear it.
        amount_varies:
          type: boolean
          description: |
            The amount varies from bill to bill, so the price is an estimate.
            An absent key keeps the current value; a new subscription defaults
            to `false`.
        visibility:
          type: string
          enum: [household, payer]
          default: household
          description: |
            `payer` keeps the subscription to its owner: nobody else in the
            household sees it, in either isolation mode and whatever their
            role, and it is left out of their totals. Only the owner may set it,
            only when the payer is the owner or unset, and never on a split
            subscription. An absent key keeps the current setting.
        category_id:
          type: integer
          nullable: true
          minimum: 1
          description: An id of 0 or less is a 422, as an id that doesn't exist is; null clears it.
        payment_method_id:
          type: integer
          nullable: true
          minimum: 1
          description: |
            What the subscription is paid with. Unlike the other fields, an
            absent key leaves the current assignment alone, so a client written
            before this field existed does not clear it; send null to clear it.
            An id of 0 or less is a 422, as an id that doesn't exist is.
        owner_user_id:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Must be a member of the household; 0 or less is a 422, as a
            non-member is. Ignored when the token's user is fenced to their own
            rows: in ISOLATED mode, and for a Contributor in SHARED mode too.
            They own only what they make.
        payer_user_id:
          type: integer
          nullable: true
          minimum: 1
          description: Must be a member of the household; 0 or less is a 422, as a non-member is.
        tags:
          type: array
          items: { type: string, maxLength: 50 }
          maxItems: 25
          description: |
            Tags are created by name if they do not exist, matched whole and
            ignoring case and accents. More than 25 tags, or a tag over 50
            characters, is refused with `422` rather than cut.

    Subscription:
      allOf:
        - $ref: "#/components/schemas/SubscriptionInput"
        - type: object
          required:
            - id
            - price_minor
            - currency
            - is_active
            - created_at
            - updated_at
          properties:
            id: { type: integer }
            anchor_day:
              type: integer
              nullable: true
              description: |
                The day of the month billing returns to after a short month.
                31 on a monthly subscription means the last day of every
                month, as the web form's "On the last day of the month" sets
                it; a PUT that leaves the payment date on a month end keeps it,
                and one that leaves it on the day a later anchor clamps to in a
                shorter month (the 30th's 28 February) keeps that anchor,
                unless the cycle changes.
            category_name: { type: string, nullable: true }
            payment_method_name: { type: string, nullable: true }
            split_mode: { type: string, enum: [none, equal, custom] }
            usage_count: { type: integer }
            usage_rating: { type: integer, nullable: true }
            logo_path:
              type: string
              nullable: true
              description: Read-only. Set it with the logo endpoints.
            website_url:
              type: string
              nullable: true
              description: |
                Where the subscription is managed. Also the domain its icon is
                fetched from when no logo has been uploaded — that fetch goes
                through the instance's guarded HTTP client and is cached per
                domain.
            monthly_minor:
              type: integer
              nullable: true
              description: Read-only. Equivalent monthly cost in minor units.
            yearly_minor: { type: integer, nullable: true }
            next_charge_date:
              type: string
              format: date
              nullable: true
              description: |
                Read-only. The trial's conversion date while a trial is running,
                and the next payment date otherwise.
            cancellation_deadline:
              type: string
              format: date
              nullable: true
              description: Read-only. The last day to cancel and avoid the next charge.
            days_until_next_payment: { type: integer, nullable: true }
            price_is_promotional:
              type: boolean
              description: |
                Read-only. The current price is an introductory or promotional
                one. Entered in the web interface, where the offer's end is
                written as a scheduled price change; a PUT leaves it alone.
            promo_ends_on:
              type: string
              format: date
              nullable: true
              description: |
                Read-only. The day the offer's price ends and the next price
                takes effect. Null when the price is not promotional, or the
                end is not known.
            promo_then_price_minor:
              type: integer
              nullable: true
              description: |
                Read-only. What it costs from promo_ends_on, in minor units of
                the subscription's currency. Null with promo_ends_on.
            cancelled_at:
              type: string
              format: date
              nullable: true
              description: |
                Read-only. The day it was cancelled. Set and cleared by the
                cancel and uncancel endpoints, and set by the catch-up to the
                day after a fixed term's last payment.
            status:
              type: string
              enum: [active, trial, paused, cancelled]
              description: |
                Read-only. Derived in this order: cancelled, then paused
                (inactive and not cancelled), then trial, then active.
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
