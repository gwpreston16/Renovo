; Application PHP settings. Kept small and explicit so an operator can see
; exactly what differs from the stock image.

expose_php = Off
memory_limit = 256M
max_execution_time = 30

; Uploads: logos only, so these stay deliberately small.
upload_max_filesize = 4M
post_max_size = 8M

; Errors go to the container log, never to the browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

; Sessions are stored in the database by the application's own handler; the
; file handler is never used.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.use_only_cookies = 1
; Both are deprecated in PHP 8.4 and ignored from 8.5; set here, not in session_start().
session.sid_length = 48
session.sid_bits_per_character = 5

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
