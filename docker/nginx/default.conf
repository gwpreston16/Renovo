server {
    listen 80;
    server_name _;

    # Only public/ is served. Everything else — src, config, .env, vendor —
    # sits outside the web root and is unreachable by design.
    root /var/www/html/public;
    index index.php;

    client_max_body_size 8m;

    # Uploaded logos are static files and must never be executed. The sandbox
    # policy is the one the application puts on every uploaded file it serves.
    location ^~ /assets/logos/ {
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        # The headers PHP sets on everything it answers (Phase 41), for the
        # files nginx answers itself. Repeated per block: a location with any
        # add_header of its own inherits none from the server.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        default_type application/octet-stream;
        types { image/png png; image/jpeg jpg jpeg; image/gif gif; image/webp webp; }
        try_files $uri =404;
    }

    # The asset build's output. Every filename here contains a hash of the
    # file's own contents, so the URL changes whenever the bytes do and the
    # answer can be cached for as long as a browser is willing to keep it.
    #
    # It needs a block of its own: without one, `/build/` falls through to
    # `location /` and a missing hashed file is answered by index.php with an
    # application-rendered HTML 404 instead of a static one — and nothing here
    # would get a cache header at all.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Text files compress to a fraction of their size. Only here: HTML from
        # index.php is never compressed by this image, because a page carries
        # the session's CSRF token and a compressed response that reflects
        # the visitor's input (the list search) lets that token be recovered
        # (BREACH). Fonts and images are already compressed and are not listed.
        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain;
        # The headers PHP sets on everything it answers (Phase 41), for the
        # files nginx answers itself. Repeated per block: a location with any
        # add_header of its own inherits none from the server.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        # As /build/ above: text only, and never the application's HTML (BREACH).
        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain;
        # The headers PHP sets on everything it answers (Phase 41), for the
        # files nginx answers itself. Repeated per block: a location with any
        # add_header of its own inherits none from the server.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location / {
        # The headers PHP sets on everything it answers (Phase 41), for the
        # files nginx answers itself. Repeated per block: a location with any
        # add_header of its own inherits none from the server.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri /index.php$is_args$args;
    }

    # No add_header here: the application sets its own security headers.
    location ~ ^/index\.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 60s;
    }

    # No other PHP file is directly reachable.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # Nothing is added at server level: PHP sets the security headers on what
    # it answers (SecurityHeadersMiddleware), and a server-level add_header
    # would reach the index.php block and send each of them twice.
}
