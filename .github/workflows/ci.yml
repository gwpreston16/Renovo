name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and static analysis need no database, so they fail fast and cheaply.
  static:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, pdo_mysql, curl, zip, sodium, openssl
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: PHP_CodeSniffer (PSR-12)
        run: vendor/bin/phpcs

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # Every locale against the base catalogue, both directions: a key with no
      # translation fails, and so does a translation for a key the base no
      # longer has — the second being the one that would otherwise sit there
      # for years while a page silently falls back to English. No database
      # needed, so it belongs in this job.
      - name: Locales match the base catalogue
        env:
          SESSION_KEY: ci-session-key-not-a-secret-0000000000000000
        run: php bin/console i18n:check

      # The OpenAPI document is the API's contract, so it is checked against the
      # application's own route table in both directions: an endpoint that is
      # not described fails here, and so does a description with no endpoint
      # behind it. It needs no database — only the route table — so it runs in
      # this job and fails in seconds rather than after the full suite.
      - name: OpenAPI spec matches the routes
        env:
          SESSION_KEY: ci-session-key-not-a-secret-0000000000000000
        run: vendor/bin/phpunit --no-coverage tests/Unit/OpenApiCoverageTest.php

      # The prose reference in docs/api.md describes the same API a third time,
      # and prose is what rots: nothing breaks when an endpoint goes
      # undocumented, so nobody notices. The endpoints it lists are checked
      # against the route table the same way the spec is, and its role matrix
      # and worked GET /me response against PermissionService, so the file
      # cannot quietly stop being true. Route table only, no database.
      - name: The API reference matches the routes and the permissions
        env:
          SESSION_KEY: ci-session-key-not-a-secret-0000000000000000
        run: vendor/bin/phpunit --no-coverage tests/Unit/ApiDocCoverageTest.php

  # Whether anything Renovo ships has a known vulnerability (Phase 43). Reads
  # the lock files, so nothing is installed. A Composer advisory fails the
  # build whatever its severity, which is `composer audit`'s own default; npm
  # fails on a high one in what ships, and on a critical one in the build
  # tooling. A Composer advisory that does not apply is accepted with a reason
  # and a review date in `composer.json` (`config.audit.ignore`); see
  # "Accepting an advisory" in docs/development.md.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Composer packages
        run: composer audit --locked

      # What reaches the build's output.
      - name: npm packages that ship
        run: npm audit --omit=dev --audit-level=high

      # The tooling that builds the assets too: a compromised one writes into
      # what ships.
      - name: npm build tooling
        run: npm audit --audit-level=critical

  # The full suite runs against both engines: portable SQL is only portable if
  # somebody checks.
  tests:
    name: Tests (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            driver: pgsql
            port: 5432
            other_driver: mysql
            other_port: 3306
          - engine: mysql
            driver: mysql
            port: 3306
            other_driver: pgsql
            other_port: 5432

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: renovo_test
          POSTGRES_USER: renovo
          POSTGRES_PASSWORD: renovo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U renovo -d renovo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: renovo_test
          MYSQL_USER: renovo
          MYSQL_PASSWORD: renovo
          MYSQL_ROOT_PASSWORD: renovo-root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -prenovo-root"
          --health-interval 5s --health-timeout 5s --health-retries 20

      # S3-compatible storage for the backup-destination tests (Phase 39).
      # MinIO no longer publishes a pullable image; RustFS speaks the same API
      # and checks the signed payload hash the way S3 does.
      s3:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: renovotest
          RUSTFS_SECRET_KEY: renovotestsecret
        ports: ['9000:9000']

    env:
      APP_ENV: test
      APP_DEBUG: 'true'
      APP_URL: http://localhost:9090
      DB_DRIVER: ${{ matrix.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_NAME: renovo_test
      DB_USER: renovo
      DB_PASSWORD: renovo
      SESSION_KEY: ci-session-key-not-a-secret-0000000000000000
      SESSION_COOKIE_SECURE: 'false'
      # Both engines run on every leg, so the instance-backup test restores a
      # backup taken on this leg's engine into the other one (Phase 38).
      CROSS_ENGINE_DB_DRIVER: ${{ matrix.other_driver }}
      CROSS_ENGINE_DB_HOST: 127.0.0.1
      CROSS_ENGINE_DB_PORT: ${{ matrix.other_port }}
      CROSS_ENGINE_DB_NAME: renovo_test
      CROSS_ENGINE_DB_USER: renovo
      CROSS_ENGINE_DB_PASSWORD: renovo
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_KEY: renovotest
      TEST_S3_SECRET: renovotestsecret
      TEST_S3_BUCKET: renovo-test
      # An empty database on this leg's engine for the restore rehearsal
      # tests (Phase 39), made by the step below.
      TEST_REHEARSAL_DB_NAME: renovo_rehearsal_test

    steps:
      # Full history, so the coverage step can diff this branch against the
      # one it is merging into.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Coverage is measured on the Postgres leg only: the same code runs on
      # both, so a second measurement adds nothing but time.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, pdo_mysql, curl, zip, sodium, openssl
          coverage: ${{ matrix.driver == 'pgsql' && 'pcov' || 'none' }}
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Every rendered page names the built stylesheet through the asset
      # manifest, so the functional tests need a build in place for the same
      # reason a browser does. Built here rather than faked: a fixture manifest
      # would let the tests pass while the real one was wrong.
      - name: Build the assets
        run: |
          npm ci
          npm run build

      - name: Apply migrations
        run: vendor/bin/phinx migrate --configuration phinx.php

      - name: Verify migrations roll back cleanly
        run: |
          vendor/bin/phinx rollback --configuration phinx.php --target=0 --force
          vendor/bin/phinx migrate --configuration phinx.php

      # The other engine's database, at the same version, for the
      # cross-engine restore test.
      - name: Apply migrations to the other engine
        env:
          DB_DRIVER: ${{ matrix.other_driver }}
          DB_PORT: ${{ matrix.other_port }}
        run: vendor/bin/phinx migrate --configuration phinx.php

      # The scratch database a restore rehearsal restores into and empties.
      # Through PDO, so the runner needs no database client.
      - name: Create the rehearsal scratch databases
        run: |
          php -r '$pg = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=renovo_test", "renovo", "renovo");
            $pg->exec("CREATE DATABASE renovo_rehearsal_test");
            $my = new PDO("mysql:host=127.0.0.1;port=3306", "root", "renovo-root");
            $my->exec("CREATE DATABASE renovo_rehearsal_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");
            $my->exec("GRANT ALL ON renovo_rehearsal_test.* TO \"renovo\"@\"%\"");'

      - name: PHPUnit
        if: matrix.driver != 'pgsql'
        run: vendor/bin/phpunit

      - name: PHPUnit, with coverage
        if: matrix.driver == 'pgsql'
        run: vendor/bin/phpunit --coverage-clover build/coverage.xml

      # Code a pull request adds or changes is covered to at least 80%. Measured
      # on the diff rather than the total, because the total barely moves when
      # one PR lands untested code. Pull requests only: on a push there is no
      # base to diff against, and an empty diff would pass having checked
      # nothing.
      - name: Changed lines are covered (80%)
        if: matrix.driver == 'pgsql' && github.event_name == 'pull_request'
        run: |
          pipx run --spec diff-cover==10.6.0 diff-cover build/coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} --fail-under=80

      # And the whole suite does not slide below the floor, which many small,
      # individually passing PRs could otherwise add up to.
      - name: Overall coverage stays above the floor (85%)
        if: matrix.driver == 'pgsql'
        run: php bin/console coverage:check build/coverage.xml

  # The asset build, and the rule that makes it worth having: a self-hosted
  # instance may have no route to a CDN, so nothing the browser loads may come
  # from a third-party host. Both halves run here — the build has to succeed,
  # and its output has to be free of external hosts. A check of the sources
  # alone would miss a dependency that hardcodes a font CDN in its own
  # @font-face, which is the failure most likely to happen and least likely to
  # be noticed.
  assets:
    name: Asset build and the offline rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, pdo_mysql, curl, zip, sodium, openssl
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Build the assets
        run: npm run build

      - name: Nothing is loaded from a third-party host
        env:
          SESSION_KEY: ci-session-key-not-a-secret-0000000000000000
        run: php bin/console assets:offline-check

      # Checks the built output itself: that the manifest names the entries the
      # layout asks for, that the vendored font's @font-face points at a local
      # hashed file that is actually there, and that the compiled stylesheet
      # carries the design tokens — both theme sets, tabular figures, and every
      # text colour clearing AA on the surface it is used against. Only
      # meaningful once a build has run, so it runs here rather than in the
      # test job.
      - name: The build produced what the application expects
        env:
          SESSION_KEY: ci-session-key-not-a-secret-0000000000000000
        # --fail-on-skipped, because both of these skip themselves when there
        # is no build: without it, the one job that exists to check the build
        # would go green on not having checked anything.
        run: |
          vendor/bin/phpunit --no-coverage --fail-on-skipped \
            tests/Unit/BuiltAssetsTest.php tests/Unit/DesignTokensTest.php

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: The application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: app
          push: false
          load: true
          tags: renovo-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Known vulnerabilities in the image as shipped (Phase 43): the base
      # image's packages and the Composer ones inside it. Fails on a HIGH or
      # CRITICAL one that has a fix; one with no fix yet is reported in the
      # log but does not fail the build, or a base-image advisory would block
      # every pull request until upstream acts. One that does not apply is
      # accepted in `.trivyignore`, with a reason and a review date.
      - name: Scan the application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: renovo-app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table

      # The web image too: it carries the web root, compiled assets included,
      # because those exist only inside the image. A stage that does not build
      # is a stack that serves no stylesheet.
      - name: The web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: web
          push: false
          load: true
          tags: renovo-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: renovo-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table
